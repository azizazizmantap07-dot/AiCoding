# ---- Build speed ----
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
# Configuration cache: AGP 8.7 + Kotlin 2.2 umumnya stabil; nonaktifkan jika CI gagal aneh
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# ---- Android / Kotlin ----
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.incremental=true
# KSP: hindari rebuild penuh tidak perlu
ksp.incremental=true
