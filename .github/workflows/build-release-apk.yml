name: Build Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build assembleRelease (ABI split)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Cache Gradle dependency & build cache → build ulang jauh lebih cepat
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: false
          cache-read-only: false

      # AGP 8.13 butuh Gradle >= 8.13. Wrapper lama di repo (8.9) TIDAK cukup, jadi step ini
      # memastikan versinya benar, baik wrapper sudah ada maupun belum:
      #  - belum ada  -> generate di folder temporer berisi settings.gradle kosong (Gradle 9
      #                  bawaan runner menolak folder tanpa build; dan proyek ini tidak ikut
      #                  di-configure), lalu salin ke repo. Normalnya wrapper sudah ikut di repo.
      #  - sudah ada  -> ganti distributionUrl bila bukan 8.14.3.
      # Tidak commit/push di sini (push ke tag ditolak pada workflow release). Commit
      # gradle/wrapper/gradle-wrapper.properties dari zip agar permanen.
      - name: Generate Gradle Wrapper (jika belum ada)
        id: gen_wrapper
        run: |
          set -e
          if [ ! -f "./gradlew" ] || [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            tmp="$(mktemp -d)"
            ( cd "$tmp" && touch settings.gradle && gradle wrapper --gradle-version 8.14.3 --distribution-type bin )
            mkdir -p gradle/wrapper
            cp "$tmp/gradlew" "$tmp/gradlew.bat" .
            cp "$tmp/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
            cp "$tmp/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
            echo "Wrapper baru dibuat (8.14.3)."
          fi
          props=gradle/wrapper/gradle-wrapper.properties
          if ! grep -q "gradle-8.14.3-bin.zip" "$props"; then
            echo "Wrapper lama terdeteksi, naikkan ke 8.14.3:"; grep distributionUrl "$props" || true
            sed -i '/^distributionSha256Sum=/d' "$props"
            sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip#' "$props"
            echo "distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531" >> "$props"
          fi
          chmod +x ./gradlew
          grep -E "distributionUrl|distributionSha256Sum" "$props"
          echo "generated=false" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode release keystore dari GitHub Secret
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 belum diisi. Lihat RELEASE-SETUP.md"
            exit 1
          fi
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/aicoder-release.jks
          test -s keystore/aicoder-release.jks
          echo "Keystore OK ($(wc -c < keystore/aicoder-release.jks) bytes)"

      - name: Build signed release APKs (ABI split + minify)
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/keystore/aicoder-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Secret signing belum lengkap."
            exit 1
          fi
          # Parallel + build cache aktif lewat gradle.properties
          ./gradlew assembleRelease --stacktrace --build-cache

      - name: Siapkan artefak APK per ABI
        run: |
          set -e
          mkdir -p dist
          VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          # Output AGP split: app-armeabi-v7a-release.apk, app-arm64-v8a-release.apk
          found=0
          for f in app/build/outputs/apk/release/*.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              *armeabi-v7a*) out="AI-Coder-${VERSION}-arm32-release.apk" ;;
              *arm64-v8a*)   out="AI-Coder-${VERSION}-arm64-release.apk" ;;
              *universal*)   out="AI-Coder-${VERSION}-universal-release.apk" ;;
              *)             out="AI-Coder-${VERSION}-${base}" ;;
            esac
            cp "$f" "dist/$out"
            echo "→ dist/$out ($(wc -c < "dist/$out") bytes)"
            found=1
          done
          if [ "$found" -ne 1 ] && [ ! "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::Tidak ada APK di app/build/outputs/apk/release"
            ls -laR app/build/outputs/apk || true
            exit 1
          fi
          ls -la dist/

      - name: Upload release APKs (arm32 + arm64)
        uses: actions/upload-artifact@v6
        with:
          name: AI-Coder-release-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Hapus keystore dari runner
        if: always()
        run: rm -f keystore/aicoder-release.jks keystore/keystore.properties || true
